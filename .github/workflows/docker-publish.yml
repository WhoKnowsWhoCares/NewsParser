name: Docker images

on:
  push:
    branches: [prod]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # images live under the repo owner; lowercase, like ghcr requires
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/newsparser

jobs:
  # prod images must ship tested code: run the same suite as ci.yml first
  tests:
    runs-on: ubuntu-latest
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5434
      TEST_DB_NAME: newsparser_test
      TEST_DB_USER: newsparser
      TEST_DB_PASSWORD: newsparser
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6380
      EMBED_DIM: "8"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: newsparser_test
          POSTGRES_USER: newsparser
          POSTGRES_PASSWORD: newsparser
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U newsparser -d newsparser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check newsparser tests
      - name: Apply schema
        run: |
          sed 's/{EMBED_DIM}/8/g' docker/db/init/schema.sql.template > /tmp/schema.sql
          PGPASSWORD=newsparser psql -h localhost -p 5434 -U newsparser -d newsparser_test -f /tmp/schema.sql
      - run: uv run python tests/test_processor_e2e.py
      - run: uv run python tests/test_api_smoke.py
      - run: uv run python tests/test_stale_backfill_e2e.py

  build-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # one image per service; all share the same Dockerfile,
        # the compose prod file assigns the command per service
        service: [api, collector, processor, tgbot]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            # latest on prod pushes (the default branch tag does not apply:
            # prod is not the repo default branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
