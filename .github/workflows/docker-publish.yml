name: Docker images

on:
  push:
    branches: [prod]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # images live under the repo owner; lowercase, like ghcr requires
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/newsparser

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # one image per service; all share the same Dockerfile,
        # the compose prod file assigns the command per service
        service: [api, collector, processor, tgbot]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            # latest on prod pushes (the default branch tag does not apply:
            # prod is not the repo default branch)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
