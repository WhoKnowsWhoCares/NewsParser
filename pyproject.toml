[project]
name = "newsparser"
version = "0.2.0"
description = "News aggregator: RSS / site scraping / Telegram channels -> dedup via pgvector -> LLM summaries -> web API + Telegram bot"
readme = "README.md"
authors = [{ name = "alexander", email = "as.frantsev@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    # parsers
    "feedparser>=6.0.11",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "telethon>=1.36.0",
    "python-socks[asyncio]>=2.4.0",
    # queue / cache
    "redis>=5.0.4",
    # db
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    # llm
    "httpx>=0.27.0",
    # api / web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    # metrics
    "prometheus-client>=0.20.0",
    # bot
    "python-telegram-bot[socks]>=21.3",
    # common
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsparser"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
