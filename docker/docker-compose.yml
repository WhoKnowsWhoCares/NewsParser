services:
  newsparser-postgres:
    image: pgvector/pgvector:pg17
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-newsparser}
      POSTGRES_USER: ${DB_USER:-newsparser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newsparser}
      # schema init reads this (01_schema.sh): must match the embeddings model
      EMBED_DIM: ${EMBED_DIM:-4096}
    # no host ports: postgres reachable only inside the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-newsparser} -d ${DB_NAME:-newsparser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  newsparser-redis:
    image: redis:7-alpine
    container_name: news_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # no host ports: redis reachable only inside the compose network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  newsparser-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: news_parsers
    restart: unless-stopped
    command: ["python", "-m", "newsparser.parsers.main"]
    env_file: ../.env
    environment:
      METRICS_PORT: "9101"
    volumes:
      # telethon session (authorized via newsparser/tools/tg_login.py on the host)
      - ../newsparser.session:/app/newsparser.session
    depends_on:
      newsparser-redis:
        condition: service_healthy
    # parser loop heartbeats /tmp/liveness_collector; stale file => restart
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/liveness_collector 2>/dev/null || date +%s) )) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  newsparser-processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: news_processor
    restart: unless-stopped
    command: ["python", "-m", "newsparser.processor.main"]
    env_file: ../.env
    environment:
      METRICS_PORT: "9102"
    depends_on:
      newsparser-redis:
        condition: service_healthy
      newsparser-postgres:
        condition: service_healthy
    # processing loop heartbeats /tmp/liveness_processor; stale file => restart
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/liveness_processor 2>/dev/null || date +%s) )) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  newsparser-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: news_api
    restart: unless-stopped
    command: ["uvicorn", "newsparser.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # the only externally exposed service: web page + API
    ports:
      - "${API_PORT:-8003}:8000"
    env_file: ../.env
    depends_on:
      newsparser-redis:
        condition: service_healthy
      newsparser-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  newsparser-tgbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: news_tgbot
    restart: unless-stopped
    command: ["python", "-m", "newsparser.tgbot.main"]
    env_file: ../.env
    depends_on:
      newsparser-redis:
        condition: service_healthy
      newsparser-postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
